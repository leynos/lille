name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests run the
# coverage build (and, once CodeScene enables the per-project gate, the
# changed-line `cs-coverage check`) in ci.yml instead. This workflow also
# advances the coverage ratchet baseline: caches saved on main are
# readable by every pull-request run, so the baseline written here is the
# one PR ratchet checks compare against.

on:
  push:
    branches: [main]

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-8
    # Ubicloud jobs bill by the minute, so a hung step must not run to the
    # 6-hour platform default. The 2026-09-03 baseline median was 561 s.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Bevy's render features make the coverage build heavy; lift the
      # shared-action cargo wall-clock cap (default 600 s) accordingly.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          # Sole owner of ~/.cargo/registry and ~/.cargo/git for this job, and
          # the trunk writer whose entry every pull-request run restores.
          cache-provider: github
          # See ci.yml: nothing sets RUSTC_WRAPPER, so the sccache install
          # would download a binary that serves no compilation.
          use-sccache: 'false'
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          all-features: 'true'
          all-targets: 'true'
          doctests: 'true'
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          # `setup-rust` above already owns ~/.cargo/registry and ~/.cargo/git.
          cache-provider: external
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
