name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push, and this is the only
# workflow that may talk to CodeScene or hold its credential. Pull
# requests measure coverage against the ratchet in ci.yml and publish
# nothing. This workflow also advances the coverage ratchet baseline:
# caches saved on main are readable by every pull-request run, so the
# baseline written here is the one PR ratchet checks compare against.

# The push to main is the only trigger, and the contract holds it to that
# by equality. That is the first trunk guard; the second is the upload
# step's own `github.ref` conjunct, which still holds should another
# trigger ever be added.
on:
  push:
    branches: [main]

# Runs never cancel and never overlap. A cancelled publisher abandons its
# upload and the baseline write the next pull request reads. GitHub keeps
# one pending run per group, and a newer trigger replaces it, so a burst
# of pushes collapses. No commit order is promised beyond that: GitHub
# does not promise to start runs in trigger order. A manual re-run keeps
# its run_id, so it republishes that commit's coverage but replaces no
# ratchet baseline, which is saved under a run-keyed cache key.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Measures coverage and uploads it to CodeScene, on a GitHub-hosted runner
  # (free on a public repository). It saves no ratchet baseline: a hosted
  # runner writes GitHub's cache store, which the Ubicloud pull-request lanes
  # never read. It hands the figures on as an artefact, and `coverage-baseline`
  # below checks and saves them where the lanes can see them.
  coverage-upload:
    runs-on: ubuntu-24.04
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    # A hung step must not run to the 6-hour platform default. A cold
    # instrumented build on a hosted four-vCPU runner finished inside 120
    # minutes, lint included (the Dependabot lane runs the same build there),
    # and the pull-request lane uses the same 120-minute bound on Ubicloud.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # See ci.yml. This job is the cold writer, so it is the one that would
      # have hit the old 1,800 s cargo cap first: its eight-vCPU run already
      # took 1,757 s.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '5400'
      # See ci.yml. sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ubicloud's `standard-8` label is inherited here, never measured. Sample
      # memory and disk every 15 s so the next shape decision rests on evidence
      # rather than on what a previous change happened to pick. Disk, not
      # memory, is what has killed jobs elsewhere in this rollout, and it did so
      # silently, so both are recorded.
      - name: Start the resource sampler
        shell: bash
        env:
          RESOURCE_SAMPLES: ${{ runner.temp }}/resource-samples.txt
        run: |
          set -euo pipefail
          : > "$RESOURCE_SAMPLES"
          sampler="$RUNNER_TEMP/sample-resources.sh"
          cat > "$sampler" <<'SAMPLER'
          #!/usr/bin/env bash
          set -uo pipefail
          while :; do
            mem_used="$(free -m | awk '/^Mem:/ { print $3 }')"
            disk="$(df -m --output=used,avail / | tail -1)"
            printf '%s %s\n' "$mem_used" "$disk" >> "$1"
            sleep 15
          done
          SAMPLER
          chmod +x "$sampler"
          nohup "$sampler" "$RESOURCE_SAMPLES" >/dev/null 2>&1 &
          printf 'RESOURCE_SAMPLES=%s\n' "$RESOURCE_SAMPLES" >> "$GITHUB_ENV"
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          install-mold: 'true'
          # Sole owner of ~/.cargo/registry and ~/.cargo/git for this job.
          cache-provider: github
          # No compiler cache on a hosted runner: it can only reach GitHub's
          # store, which throttles sccache's writes and which no Ubicloud lane
          # reads. The job compiles cold and costs nothing; the statistics
          # step below reports that sccache did not start.
          use-sccache: 'false'
      - name: Generate coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is a
          # measurement, so it takes neither the parallel frontend nor the mold linker.
          # Assigning RUSTFLAGS displaces every `rustflags` table in .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          all-features: 'true'
          all-targets: 'true'
          doctests: 'true'
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          # No baseline is read or saved here; see the job comment. The figures
          # travel to `coverage-baseline` as an artefact.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
          # `setup-rust` above already owns ~/.cargo/registry and ~/.cargo/git.
          cache-provider: external
      - name: Reclaim the coverage scratch tree
        # See ci.yml. This job saves the trunk cache entries, so the scratch
        # tree must be gone before the saves rather than after them.
        if: always()
        run: |
          set -euo pipefail
          df -h .
          rm -rf -- target/llvm-cov-target
          df -h .
      - name: Report peak resource use
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          samples="${RESOURCE_SAMPLES:-}"
          if [[ -z "$samples" || ! -s "$samples" ]]; then
            echo 'No resource samples were recorded.'
            exit 0
          fi
          peak_memory="$(awk '{ print $1 }' "$samples" | sort -n | tail -1)"
          peak_disk="$(awk '{ print $2 }' "$samples" | sort -n | tail -1)"
          least_free="$(awk '{ print $3 }' "$samples" | sort -n | head -1)"
          count="$(wc -l < "$samples")"
          printf 'peak used memory: %s MiB\n' "$peak_memory"
          printf 'peak used disk: %s MiB\n' "$peak_disk"
          printf 'least free disk: %s MiB\n' "$least_free"
          printf 'samples: %s at 15 second intervals\n' "$count"
          {
            printf '### Resources (%s)\n\n' "${GITHUB_JOB}"
            printf -- '- peak used memory: %s MiB\n' "$peak_memory"
            printf -- '- peak used disk: %s MiB\n' "$peak_disk"
            printf -- '- least free disk: %s MiB\n' "$least_free"
            printf -- '- samples: %s at 15 second intervals\n' "$count"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        env:
          SCCACHE_STATUS: ${{ steps.setup-rust.outputs.sccache-status }}
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # `if: always()` runs this even when an earlier step failed before
          # sccache was installed. Reporting nothing is correct there; failing
          # here would bury the real failure under a second one.
          if ! command -v sccache >/dev/null 2>&1; then
            echo 'sccache is not installed; no compiler-cache statistics to report.'
            exit 0
          fi
          # A server that never started has no statistics: with no server
          # `sccache --show-stats` prints empty defaults rather than starting
          # one, which would read as a broken integration.
          if [[ "${SCCACHE_STATUS}" != started ]]; then
            echo 'sccache did not start; no compiler-cache statistics to report.'
            exit 0
          fi
          # `Cache location` reads `ghac` for the Ubicloud proxy and for GitHub's own
          # service alike, so name the backend `setup-rust` chose.
          printf 'backend: %s\n' "${SCCACHE_BACKEND}"
          # To the log as well as the summary: the summary is not readable
          # through the REST API.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf 'backend: %s\n\n' "${SCCACHE_BACKEND}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      # Whether the credential exists, without putting it in any step's
      # `env`. The expression is evaluated before the shell runs, so the
      # command writes a literal `true` or `false` and holds no conditional.
      # The upload action is composite and hands its step's `env` to the
      # `upload-artifact` and cache steps nested inside it, so the token is
      # passed to it as an input and bound nowhere else.
      - name: Check the CodeScene credential is available
        id: codescene-credential
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The trunk guard is a conjunct of its own even though the push to
        # main is this workflow's only trigger: a dispatch trigger added later
        # could otherwise upload another branch's report as the project's.
        if: steps.codescene-credential.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          format: lcov
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  # Checks the handed-over figures against the stored baseline and saves them
  # under the key the pull-request ratchet restores. It runs on Ubicloud, the
  # cache store those lanes read, and compiles nothing. It runs only when
  # `coverage-upload` passed, so a failed run never advances the baseline.
  coverage-baseline:
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          artefact-name: coverage-baseline-handover

  # Compiles the instrumented tests the pull-request lane builds, without
  # running them, so that lane's compiler-cache reads hit. It is the only
  # writer of the Ubicloud compiler cache, on the lane's own runner shape, and
  # depends on nothing: a failing test is no reason to leave the cache cold.
  coverage-warmup:
    runs-on: ubicloud-standard-4
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      RUN_RUST_CARGO_WAIT_TIMEOUT: '5400'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          install-mold: 'true'
          cache-provider: github
          expect-cache: ubicloud
      - name: Compile the instrumented tests
        env:
          # The same RUSTFLAGS as the lane's coverage step, so the compiler
          # cache keys match.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          all-features: 'true'
          all-targets: 'true'
          doctests: 'true'
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          build-only: 'true'
          cache-provider: external
      - name: Reclaim the coverage scratch tree
        if: always()
        run: rm -rf -- target/llvm-cov-target
      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        env:
          SCCACHE_STATUS: ${{ steps.setup-rust.outputs.sccache-status }}
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # `if: always()` runs this even when an earlier step failed before
          # sccache was installed. Reporting nothing is correct there; failing
          # here would bury the real failure under a second one.
          if ! command -v sccache >/dev/null 2>&1; then
            echo 'sccache is not installed; no compiler-cache statistics to report.'
            exit 0
          fi
          if [[ "${SCCACHE_STATUS}" != started ]]; then
            echo 'sccache did not start; no compiler-cache statistics to report.'
            exit 0
          fi
          printf 'backend: %s\n' "${SCCACHE_BACKEND}"
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf 'backend: %s\n\n' "${SCCACHE_BACKEND}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
