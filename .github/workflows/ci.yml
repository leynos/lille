name: CI

on:
  pull_request:
    branches: [main]
  # Warm-run dispatches. A dispatch restores the caches a pull request
  # would restore and writes none of them: coverage-main.yml is the only
  # writer on this repository, so a manual run can measure a warm build
  # without displacing the trunk entry it read.
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion. Outside a pull request
# the group falls back to the run's own id rather than the ref: a group shared
# by the ref would let a third push or dispatch replace a pending second run
# that was meant to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # A pull request from a fork cannot obtain an Ubicloud runner, so the
    # fork arm falls back to a GitHub-hosted one. Keep the continuation at
    # this indent: a deeper one is a more-indented line inside a folded
    # scalar, so YAML keeps the break and the expression arrives with a
    # newline in it. GitHub evaluates it anyway, so a green run proves
    # nothing; `no_runs_on_declaration_carries_a_line_break` reads it.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # Ubicloud jobs bill by the minute, so a hung step must not run to the
    # 6-hour platform default. Measured warm: 1,478 s on eight vCPUs and
    # 1,215 s on four. A cold run on four vCPUs is the case this bounds, and
    # 90 minutes leaves room for it without leaving room for a hang.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Bevy's render features make the coverage build heavy; lift the
      # shared-action cargo wall-clock cap (default 600 s) accordingly. This is
      # a cap on one cargo command, not on the job, so it has to clear the
      # slowest single build rather than the median job. On eight vCPUs the
      # cold writer's job took 1,757 s in total; four vCPUs are slower again,
      # and 1,800 s would have killed cargo before the job timeout noticed.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '3600'
      # sccache is the sole owner of compiler output: no step archives a
      # `target` tree. `setup-rust` owns it: it installs sccache, starts the
      # server, and names it as the rustc wrapper.
      # sccache cannot cache incremental compilation, and an incremental
      # build would defeat every hit.
      CARGO_INCREMENTAL: '0'
    steps:
      # A shallow checkout, the action's default, because nothing in this job
      # reads history any more. The `cs-coverage check` step that needed the
      # pull request's merge base is gone, and the ratchet compares a
      # percentage against a cached baseline rather than a diff. Restoring
      # `fetch-depth: 0` needs a step that actually consumes the merge base;
      # it cannot be the CodeScene check, which now belongs to a push-only
      # workflow that has no pull request to find a merge base for.
      - uses: actions/checkout@v7
      # Ubicloud's `standard-8` label is inherited here, never measured. Sample
      # memory and disk every 15 s so the next shape decision rests on evidence
      # rather than on what a previous change happened to pick. Disk, not
      # memory, is what has killed jobs elsewhere in this rollout, and it did so
      # silently, so both are recorded.
      - name: Start the resource sampler
        shell: bash
        env:
          RESOURCE_SAMPLES: ${{ runner.temp }}/resource-samples.txt
        run: |
          set -euo pipefail
          : > "$RESOURCE_SAMPLES"
          sampler="$RUNNER_TEMP/sample-resources.sh"
          cat > "$sampler" <<'SAMPLER'
          #!/usr/bin/env bash
          set -uo pipefail
          while :; do
            mem_used="$(free -m | awk '/^Mem:/ { print $3 }')"
            disk="$(df -m --output=used,avail / | tail -1)"
            printf '%s %s\n' "$mem_used" "$disk" >> "$1"
            sleep 15
          done
          SAMPLER
          chmod +x "$sampler"
          nohup "$sampler" "$RESOURCE_SAMPLES" >/dev/null 2>&1 &
          printf 'RESOURCE_SAMPLES=%s\n' "$RESOURCE_SAMPLES" >> "$GITHUB_ENV"
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          # Sole owner of ~/.cargo/registry and ~/.cargo/git for this job. It
          # runs before the first cargo invocation so the lint step reads a
          # warm registry.
          cache-provider: github
          # `setup-rust` owns sccache: it selects the backend by runner, starts
          # the server with a 60 s startup timeout, and falls back to an
          # uncached build, with a `sccache-fallback` warning, if the server
          # will not start.
          expect-cache: any
      - name: Cache uv tool layers
        # `make spelling` drives uv with repository-local UV_CACHE_DIR and
        # UV_TOOL_DIR, so these two directories are the whole uv surface. This
        # job is the only one in the repository that installs uv tools, so it
        # is necessarily both the reader and the single writer; there is no
        # trunk job to designate as the writer instead.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('Makefile', 'scripts/*.py') }}
          restore-keys: |
            uv-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Spelling
        run: make spelling
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check format
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install the Whitaker Dylint suite
        # Downloads the pinned prebuilt installer and verifies it against a
        # digest pinned in the action. The action owns the cache for the
        # installer binary, its version marker, and ~/.local/share/whitaker.
        uses: leynos/shared-actions/.github/actions/install-whitaker@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          installer-version: '0.2.9'
          cache-provider: github
      - name: Lint
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          RUSTFLAGS="-D warnings" whitaker --all -- --all-targets --all-features
      # The instrumented run is this workflow's only test execution on Linux:
      # a separate uninstrumented `cargo test` repeated the suite for no extra
      # evidence and doubled the billed compile. `all-features` names exactly
      # the set the explicit feature list used to name.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@b6eb26ff70e41779a80fb7f4f073011d847ab5fc
        with:
          all-features: 'true'
          all-targets: 'true'
          doctests: 'true'
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
          # This lane measures and compares; it does not publish. The action
          # archives the report it generated under a step of its own, which no
          # scanner over this file's steps can see, so declining that archive
          # is the only way the boundary is observable here. The report stays
          # on the runner for the ratchet. `coverage-main.yml` keeps the
          # action's default and uploads.
          publish-artefact: 'false'
          # `setup-rust` above already owns ~/.cargo/registry and ~/.cargo/git;
          # this keeps the action from becoming a second owner of them.
          cache-provider: external
      - name: Reclaim the coverage scratch tree
        # The instrumented tree has no later consumer. Deleting it before the
        # caches are saved keeps a disk that has silently killed jobs on
        # smaller shapes from filling, and the two `df` calls make a shrinking
        # margin visible before it becomes a failure.
        if: always()
        run: |
          set -euo pipefail
          df -h .
          rm -rf -- target/llvm-cov-target
          df -h .
      - name: Report peak resource use
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          samples="${RESOURCE_SAMPLES:-}"
          if [[ -z "$samples" || ! -s "$samples" ]]; then
            echo 'No resource samples were recorded.'
            exit 0
          fi
          peak_memory="$(awk '{ print $1 }' "$samples" | sort -n | tail -1)"
          peak_disk="$(awk '{ print $2 }' "$samples" | sort -n | tail -1)"
          least_free="$(awk '{ print $3 }' "$samples" | sort -n | head -1)"
          count="$(wc -l < "$samples")"
          printf 'peak used memory: %s MiB\n' "$peak_memory"
          printf 'peak used disk: %s MiB\n' "$peak_disk"
          printf 'least free disk: %s MiB\n' "$least_free"
          printf 'samples: %s at 15 second intervals\n' "$count"
          {
            printf '### Resources (%s)\n\n' "${GITHUB_JOB}"
            printf -- '- peak used memory: %s MiB\n' "$peak_memory"
            printf -- '- peak used disk: %s MiB\n' "$peak_disk"
            printf -- '- least free disk: %s MiB\n' "$least_free"
            printf -- '- samples: %s at 15 second intervals\n' "$count"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        env:
          SCCACHE_STATUS: ${{ steps.setup-rust.outputs.sccache-status }}
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # `if: always()` runs this even when an earlier step failed before
          # sccache was installed. Reporting nothing is correct there; failing
          # here would bury the real failure under a second one.
          if ! command -v sccache >/dev/null 2>&1; then
            echo 'sccache is not installed; no compiler-cache statistics to report.'
            exit 0
          fi
          # A server that never started has no statistics: with no server
          # `sccache --show-stats` prints empty defaults rather than starting
          # one, which would read as a broken integration.
          if [[ "${SCCACHE_STATUS}" != started ]]; then
            echo 'sccache did not start; no compiler-cache statistics to report.'
            exit 0
          fi
          # `Cache location` reads `ghac` for the Ubicloud proxy and for GitHub's own
          # service alike, so name the backend `setup-rust` chose.
          printf 'backend: %s\n' "${SCCACHE_BACKEND}"
          # Print to the log as well as the job summary: the summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm `Cache location`, the hit rate, and any read or write
          # error after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf 'backend: %s\n\n' "${SCCACHE_BACKEND}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
