# Repository-wide Cargo defaults for the development build standard
# (concordat rule `rust-build-defaults`).
#
# The parallel `rustc` frontend and, on Linux, the `mold` linker are the
# defaults for every development, test, lint and typecheck build. Cargo
# auto-discovers this file, so a bare `cargo build` gets them too.
#
# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright, and an
# assigned `RUSTFLAGS` replaces both. Every flag is therefore repeated in each
# source here, and the Makefile composes them into the `RUSTFLAGS` its
# recipes set. Coverage and the release recipe and workflow assign `RUSTFLAGS`
# without them on purpose. A direct `cargo build --release` keeps these flags
# unless `RUSTFLAGS` is assigned.
[build]
rustflags = ["-Zthreads=8"]

# mold ships for Linux only, so the linker flag lives in a Linux-only table.
# macOS and Windows fall through to `[build] rustflags` above and keep their
# platform linker.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]

[profile.dev]
opt-level = 1          # default is 0; 1 shrinks a bit without killing compile times
debug = 1              # 2 is “full debuginfo”; 1 is usually enough
debug-assertions = true
overflow-checks = true
incremental = true
panic = "unwind"       # keep nice backtraces in normal dev builds
strip = "none"         # don't strip by default for dev

[env]
CFLAGS_aarch64_unknown_linux_gnu = "-std=gnu11"
CFLAGS_x86_64_unknown_linux_gnu = "-std=gnu11"
